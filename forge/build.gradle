// Adapted from the official 1.20.1 MDK; provenance in vendor/forge-mdk/README.md.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
base { archivesName = 'discraft-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
// Client acceptance driver is opt-in and never shipped in the mod JAR.
if (providers.gradleProperty('smoke').isPresent() || providers.gradleProperty('multiplayerSmoke').isPresent()) {
    sourceSets.main.java.srcDir 'src/smoke/java'
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory rootProject.file('run')
            if (providers.gradleProperty('multiplayerSmoke').isPresent()) {
                workingDirectory rootProject.file('run-mp/' + providers.gradleProperty('bridgeRole').getOrElse('server'))
                property 'discraft.multiplayerSmoke', 'true'
                property 'discraft.bridgeRole', providers.gradleProperty('bridgeRole').getOrElse('server')
                property 'discraft.bridgePort', providers.gradleProperty('bridgePort').getOrElse('25579')
            }
            property 'forge.logging.console.level', 'info'
            mods { discraft { source sourceSets.main; source project(':core').sourceSets.main } }
        }
        client {
            if (providers.gradleProperty('multiplayerSmoke').isPresent()) {
                args '--width', '1100', '--height', '800', '--username', providers.gradleProperty('bridgeRole').getOrElse('Alice')
            }
            if (providers.gradleProperty('smoke').isPresent()) {
                property 'discraft.smoke', 'true'
                args '--width', '1100', '--height', '800'
            }
        }
        server { args '--nogui' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    implementation project(':core')
}
tasks.named('jar', Jar) {
    exclude 'dev/discraft/forge/smoke/**'
    from project(':core').sourceSets.main.output
    finalizedBy 'reobfJar'
}

tasks.register('bridgeProtocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.discraft.forge.server.BridgeProtocolTest'
    jvmArgs '-ea', '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn bridgeProtocolTest }

// Forge 6.0.54 initializes JavaExec inside exec(), not during preparation.
// Resolve its pinned RunConfig with the same token helpers, without launching a JVM.
abstract class BridgeRunExport extends net.minecraftforge.gradle.common.util.runs.RunConfigGenerator {
    static Map resolve(org.gradle.api.Project project, def run) {
        def config = run.runConfig.get()
        def tokens = configureTokensLazy(project, config, mapModClassesToGradle(project, config), run.minecraftArtifacts, run.runtimeClasspathArtifacts)
        def jvm = config.jvmArgs.collect { config.replace(tokens, it) }
        if (config.client) jvm.addAll(run.additionalClientArgs.get().collect { config.replace(tokens, it) })
        config.properties.each { k,v -> jvm.add('-D' + k + '=' + config.replace(tokens, v)) }
        def args = getArgsStream(config, tokens, false).collect(java.util.stream.Collectors.toList())
        def classpath = project.files(config.allSources.collect { it.runtimeClasspath }).asPath
        def command = [run.javaLauncher.get().executablePath.asFile.absolutePath] + jvm.findAll { !it.startsWith('-Xmx') } + ['-Xmx1G', '-cp', classpath, run.mainClass.get()] + args
        def environment = config.environment.findAll { k,v -> k == 'MOD_CLASSES' }.collectEntries { k,v -> [(k): config.replace(tokens, v)] }
        return [command: command, directory: config.workingDirectory, environment: environment]
    }
}
tasks.register('exportBridgeLaunch') {
    def serverRole = providers.gradleProperty('bridgeRole').getOrElse('server') == 'server'
    dependsOn serverRole ? ['prepareRunServer', 'prepareRunServerCompile'] : ['prepareRunClient', 'prepareRunClientCompile']
    doLast {
        def run = tasks.named(serverRole ? 'runServer' : 'runClient', JavaExec).get()
        def target = rootProject.file('build/mp-launch-' + providers.gradleProperty('bridgeRole').getOrElse('server') + '.json')
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.toJson(BridgeRunExport.resolve(project, run))
    }
}
